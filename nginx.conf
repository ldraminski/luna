server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Wydawanie tokenów tylko z serwera (curl na 127.0.0.1:5678), nigdy z internetu.
    location /api/admin/ { return 404; }

    # Dodawanie rzeczy przyjmuje zdjęcie (JPEG zmniejszony w przeglądarce) — większy limit TYLKO tutaj.
    location = /api/items {
        include /etc/nginx/snippets/security-headers.inc;
        proxy_pass http://n8n:5678/webhook/oboe/items;
        proxy_set_header Host n8n.draminski.dev;
        proxy_read_timeout 150s;
        client_max_body_size 4m;
        add_header Cache-Control "no-store" always;
    }

    # Czat „Popraw” przyjmuje zdjęcie (JPEG zmniejszony w przeglądarce, base64) — większy limit TYLKO tutaj.
    location = /api/items/widget-chat {
        include /etc/nginx/snippets/security-headers.inc;
        proxy_pass http://n8n:5678/webhook/oboe/items/widget-chat;
        proxy_set_header Host n8n.draminski.dev;
        proxy_read_timeout 150s;
        client_max_body_size 4m;
        add_header Cache-Control "no-store" always;
    }

    # Dyktowanie: głosówka (base64, do 2 min) → Whisper u nas. Większy limit TYLKO tutaj.
    location = /api/transcribe {
        include /etc/nginx/snippets/security-headers.inc;
        proxy_pass http://n8n:5678/webhook/oboe/transcribe;
        proxy_set_header Host n8n.draminski.dev;
        proxy_read_timeout 150s;
        client_max_body_size 4m;
        add_header Cache-Control "no-store" always;
    }

    # Biurko: dłuższy materiał do rozbicia na rzeczy (do 20 000 znaków) — większy limit TYLKO tutaj.
    location = /api/items/split {
        include /etc/nginx/snippets/security-headers.inc;
        proxy_pass http://n8n:5678/webhook/oboe/items/split;
        proxy_set_header Host n8n.draminski.dev;
        proxy_read_timeout 150s;
        client_max_body_size 256k;
        add_header Cache-Control "no-store" always;
    }

    # API = webhooki n8n (tylko ta ścieżka, nic więcej z n8n nie jest dostępne przez ten host).
    location /api/ {
        include /etc/nginx/snippets/security-headers.inc;
        proxy_pass http://n8n:5678/webhook/oboe/;
        proxy_set_header Host n8n.draminski.dev;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
        add_header Cache-Control "no-store" always;
    }

    # Widgety generowane przez AI: wolumen /opt/oboe/widgets (repo git, n8n zapisuje, tu tylko odczyt).
    # CSP sandbox = osobny, nieprzezroczysty origin: widget nie widzi ciastek, storage ani API aplikacji,
    # nawet gdyby ktoś otworzył go bezpośrednio, nie przez <iframe sandbox>.
    location /widgets/ {
        alias /srv/widgets/;
        default_type text/html;
        add_header Content-Security-Policy "sandbox allow-scripts; default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Katalog widgetów to repo git — nie wystawiaj jego wnętrza (regex ma pierwszeństwo przed /widgets/).
    location ~ /\.git { deny all; }

    # Service worker i manifest zawsze świeże, inaczej telefon trzyma starą wersję apki.
    location = /sw.js { add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/security-headers.inc; }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.inc;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Biurko (wersja na komputer) — osobna strona, ten sam klucz i API co telefon.
    location = /biurko { try_files /biurko.html =404; add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/security-headers.inc; }
    location = /regulamin { try_files /regulamin.html =404; add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/security-headers.inc; }

    location / {
        include /etc/nginx/snippets/security-headers.inc;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

}
